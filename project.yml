name: KickstartIntent
options:
  bundleIdPrefix: com.agenticstudio
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  ENABLE_HARDENED_RUNTIME: YES
  ENABLE_APP_SANDBOX: NO
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: ""  # Xcode will auto-fill this with your team

targets:
  KickstartIntent:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.agenticstudio.kickstartintent
      INFOPLIST_FILE: Sources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: YES
      DEVELOPMENT_ASSET_PATHS: '"Sources/Preview Content"'
      CODE_SIGN_ENTITLEMENTS: Sources/KickstartIntent.entitlements
      SWIFT_EMIT_LOC_STRINGS: YES
    dependencies: []
    preBuildScripts: []
    postBuildScripts: []
    scheme:
      testTargets: []
      gatherCoverageData: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        NSAppleEventsUsageDescription: "This app needs to open folders and launch Claude Desktop"
        NSAppleScriptEnabled: true
